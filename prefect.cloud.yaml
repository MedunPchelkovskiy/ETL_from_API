prefect-version: "3.*"
name: etl_from_api_cloud

pull:
  - prefect.deployments.steps.set_working_directory:
      directory: /app   # или каквото е WORKDIR в Dockerfile-а ти

deployments:
  - name: Orchestrator-Deployment
    description: Cloud Prefect deployment for orchestrator flow
    entrypoint: src/flows/master/orchestrator_flow.py:orchestrator_flow


  - name: bronze-flow
    description: Cloud Prefect deployment for bronze layer
    entrypoint: src/flows/bronze/extract_data_for_ski_resorts_in_Bulgaria_flow.py:weather_flow_run
    tags: [cloud, portfolio]
    parameters:
      debug: true
    concurrency_limit: 1


  - name: silver-flow
    description: Cloud Prefect deployment for silver layer
    entrypoint: src/flows/silver/extract_bronze_data_flow.py:transform_bronze_data
    tags: [ cloud, portfolio ]
    parameters:
      debug: true
    concurrency_limit: 1


  - name: gold-flow
    description: Cloud Prefect deployment for gold forecast layer
    entrypoint: src/flows/gold/daily_dataset_forecast.py:daily_forecast
    tags: [ cloud, portfolio ]
    parameters:
      debug: true
    concurrency_limit: 1

  - name: gold-daily-summ-flow
    description: Cloud Prefect deployment for gold daily summarized forecast flow
    entrypoint: src/flows/gold/daily_summ_agg_data.py:hourly_to_daily_aggregation
    tags: [ cloud, portfolio ]


